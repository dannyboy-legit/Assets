name: Analyze image

on:
  push:
    paths:
      - "analysis/request.json"
      - ".github/workflows/analyze-image.yml"
      - "tools/analyze_image.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow gradio_client requests

      - name: Run vision analysis
        env:
          HF_SPACE: ${{ vars.HF_VISION_SPACE || 'akhaliq/Qwen3-VL-2B-Instruct' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tools/analyze_image.py analysis/request.json analysis.json

      - name: Upload JSON result
        uses: actions/upload-artifact@v4
        with:
          name: image-analysis-result
          path: analysis.json
          if-no-files-found: error
          retention-days: 7


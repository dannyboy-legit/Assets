name: Local vision analysis

on:
  push:
    paths: ["vision/inbox/**", "tools/analyze_image.py", ".github/workflows/analyze-image.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-vision-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install local vision dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate pillow sentencepiece
      - name: Run local vision analysis
        env:
          VISION_MODEL: Qwen/Qwen2.5-VL-3B-Instruct
          VISION_MAX_NEW_TOKENS: "2048"
          FORCE_RETRY_ERRORS: "true"
        run: python tools/analyze_image.py
      - name: Commit analysis results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vision/results
          if git diff --cached --quiet; then echo "No result changes."; else git commit -m "Test Qwen local vision model"; git push; fi